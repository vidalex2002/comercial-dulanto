<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración - Comercial Dulanto</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >
</head>

<body>

    <header class="admin-header">

        <div>

            <h1>
                Comercial Dulanto
            </h1>

            <p>
                Panel de administración
            </p>

        </div>

    </header>


    <main class="admin-container">

        <section class="admin-top">

            <div>

                <h2>
                    Productos
                </h2>

                <p>
                    Gestiona precios, stock y disponibilidad.
                </p>

            </div>


            <button
                class="new-product-button"
                id="new-product-button"
            >
                + Nuevo producto
            </button>

        </section>


        <section class="admin-search">

            <input
                type="text"
                id="admin-search-input"
                placeholder="Buscar producto..."
            >

        </section>


        <section
            class="admin-products"
            id="admin-products"
        >
        </section>

    </main>


    <div
        class="admin-overlay"
        id="admin-overlay"
    >
    </div>


    <aside
        class="product-editor"
        id="product-editor"
    >

        <div class="editor-header">

            <div>

                <h2 id="editor-title">
                    Editar producto
                </h2>

                <p>
                    Modifica la información del producto.
                </p>

            </div>


            <button
                class="close-editor-button"
                id="close-editor-button"
            >
                ✕
            </button>

        </div>


        <form id="product-form">

            <input
                type="hidden"
                id="product-id"
            >


            <div class="form-group">

                <label for="product-name">
                    Nombre
                </label>

                <input
                    type="text"
                    id="product-name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="product-category">
                    Categoría
                </label>

                <select
                    id="product-category"
                    required
                >

                    <option value="Bebidas">
                        Bebidas
                    </option>

                    <option value="Abarrotes">
                        Abarrotes
                    </option>

                    <option value="Snacks">
                        Snacks
                    </option>

                    <option value="Limpieza">
                        Limpieza
                    </option>

                    <option value="Lácteos">
                        Lácteos
                    </option>

                    <option value="Desayuno">
                        Desayuno
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="product-presentation">
                    Presentación
                </label>

                <input
                    type="text"
                    id="product-presentation"
                    required
                >

            </div>


            <div class="form-group">

                <label for="product-price">
                    Precio
                </label>

                <input
                    type="number"
                    id="product-price"
                    min="0"
                    step="0.10"
                    required
                >

            </div>


            <div class="form-group">

                <label for="product-stock">
                    Stock
                </label>

                <input
                    type="number"
                    id="product-stock"
                    min="0"
                    step="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="product-emoji">
                    Emoji temporal
                </label>

                <input
                    type="text"
                    id="product-emoji"
                    maxlength="4"
                >

            </div>


            <label class="available-control">

                <input
                    type="checkbox"
                    id="product-available"
                >

                <span>
                    Producto disponible
                </span>

            </label>


            <div class="editor-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancel-button"
                >
                    Cancelar
                </button>


                <button
                    type="submit"
                    class="save-button"
                >
                    Guardar producto
                </button>

            </div>

        </form>

    </aside>


    <script src="../data/productos.js"></script>
    <script src="../js/admin.js"></script>

</body>

</html>
